# Клиенты и партнёры → нейтральные названия (латиница/кириллица — целым словом, арабский — подстрокой).
terms:
  - { match: "Ministry of Municipal, Rural Affairs and Housing", replace: "Demo Ministry of Urban Affairs" }
  - { match: "Ministry of Municipal and Rural Affairs", replace: "Demo Ministry of Urban Affairs" }
  - { match: "MOMRAH", replace: "Demo Ministry" }
  - { match: "MOMRA", replace: "Demo Ministry" }
  - { match: "Момра", replace: "Демо-министерство" }
  - { match: "BaladyLens", replace: "Axion Lens" }
  - { match: "Balady", replace: "Axion City" }
  - { match: "Балади", replace: "Аксион Сити" }
  - { match: "وزارة الشؤون البلدية والقروية والإسكان", replace: "الوزارة التجريبية" }
  - { match: "وزارة البلديات", replace: "الوزارة التجريبية" }
  - { match: "بلدي", replace: "أكسيون" }
  - { match: "NCIM", replace: "Demo Center" }
  - { match: "REGA", replace: "Demo Authority" }
  - { match: "WEDO Solutions", replace: "Demo Partner" }
  - { match: "wedo.solutions", replace: "demo-partner.example" }

# Шаблоны персональных данных: заменяются с сохранением формата (длина и разделители остаются).
patterns:
  - name: email
    regex: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    kind: email
  - name: phone-sa
    regex: "(?:\\+966|00966|\\b0)\\s?5\\d(?:[\\s-]?\\d){7}"
    kind: digits
  - name: phone-intl
    regex: "\\+\\d{1,3}(?:[\\s-]?\\d){7,12}"
    kind: digits
  - name: national-id
    regex: "\\b[12]\\d{9}\\b"
    kind: digits
  - name: iban-sa
    regex: "\\bSA\\d{2}\\s?(?:\\d{4}\\s?){4}\\d{2}\\b"
    kind: chars

# Должно отсутствовать на опубликованном экране. people и terms[].match проверяются автоматически,
# сюда — то, что заменять не нужно, но видеть на экране нельзя (кодовые имена, внутренние проекты…).
blocklist: []

emailDomain: example.com
