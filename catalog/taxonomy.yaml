# Пять экранов из брифа презентации (ПЧДК) — у флоу проставлено `brief: <id>`,
# MCP и галерея умеют фильтровать только их.
briefs:
  - id: quality-check
    name: Проверка качества
    description: Контроль качества кадров/детекций — что отбраковано и почему.
  - id: executive-summary
    name: Сводка для руководителя
    description: Первые экраны разделов — KPI, инсайты, статус по направлениям (Gen, Command & Control).
  - id: decision-card
    name: Карточка решения
    description: Human-in-the-loop — система предлагает решение (штрафовать / не штрафовать), человек подтверждает.
  - id: agent-work
    name: Агентная работа
    description: Диалоги с агентом/ассистентом, ход рассуждения, результаты.
  - id: customer-system-task
    name: Задача по системе заказчика
    description: Заявка уходит во внешнюю систему/ведомство — статусы и апрувы.
